---
layout: default
---
<article class="post">
  <p class="post-game">{{ page.game }}</p>
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: '%Y.%m.%d' }}</p>
  <div class="post-body">
    {{ content }}
  </div>
  <nav class="post-nav">
    {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">← {{ page.previous.title }}</a>{% else %}<span></span>{% endif %}
    {% if page.next %}<a href="{{ page.next.url | relative_url }}">{{ page.next.title }} →</a>{% endif %}
  </nav>
</article>
